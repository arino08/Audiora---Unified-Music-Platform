<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg-gradient)"/>
  <circle cx="50" cy="50" r="48" stroke="url(#aurora-gradient)" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Sound wave circles -->
  <circle cx="50" cy="50" r="38" stroke="url(#aurora-gradient)" stroke-width="1.5" fill="none" opacity="0.3"/>
  <circle cx="50" cy="50" r="30" stroke="url(#aurora-gradient)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="50" cy="50" r="22" stroke="url(#aurora-gradient)" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Center play symbol -->
  <path d="M42 35 L42 65 L68 50 Z" fill="url(#aurora-gradient)"/>
</svg>
